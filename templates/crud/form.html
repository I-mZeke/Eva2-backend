{% extends 'base.html' %}
{% block contenido %}
<h2>{{ titulo }}</h2>
<form method="post" class="col-md-6">{% csrf_token %}{% if form.errors %}<div class="alert alert-danger">{{ form.non_field_errors }}Revisa los campos marcados.</div>{% endif %}{{ form.as_p }}
  <button class="btn btn-primary">Guardar</button>
  <a class="btn btn-secondary" href="{% url slug|add:'_lista' %}">Cancelar</a></form>
<small class="text-muted">Fechas: formato AAAA-MM-DD HH:MM (ej. 2026-11-05 08:30)</small>
{% endblock %}
