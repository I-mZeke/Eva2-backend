{% extends 'base.html' %}
{% block contenido %}
<style>
  .errorlist { display: none; }  /* los errores se muestran arriba en rojo */
</style>

<h2>Ingresar</h2>

<form method="post" class="col-md-4" novalidate>{% csrf_token %}
  {% if form.errors %}
  <div class="alert alert-danger">
    Usuario o contraseña incorrectos. Inténtalo de nuevo.
  </div>
  {% endif %}

  {{ form.as_p }}
  <button class="btn btn-primary w-100">Entrar</button>
</form>

<p class="mt-3">
  ¿No tienes cuenta?
  <a href="{% url 'registro' %}">Regístrate aquí</a>
</p>
{% endblock %}
